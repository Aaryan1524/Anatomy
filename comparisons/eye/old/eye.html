<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>The eye</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(650px,100% - 32px);margin:64px auto 96px}

// The eye, as numbers. Pure functions, no imports: build.mjs imports this
// module for the static drawing and inlines the same source into the page,
// so the picture, the motion and the readout all come from one model.
//
// Coordinates are millimetres in the horizontal meridian of a right eye:
// s runs along the optic axis toward what the eye looks at (0 = centre of
// the globe), n runs sideways, positive toward the nose.

const EYE = {
  n: 1.336, // aqueous and vitreous
  R: 12.0, // outer sclera
  scleraIn: 11.25,
  choroidIn: 10.98,
  retinaIn: 10.73, // inner retina: the image surface
  apex: 13.12, // front of the cornea
  corneaR: 7.8, // outer corneal radius
  corneaInR: 6.6,
  corneaThick: 0.55,
  limbus: 5.85, // half-width of the cornea at the limbus
  Fc: 43.0, // corneal power, D
  d: 5.6, // cornea to lens principal plane, mm
  F0: 60.0, // relaxed eye, D
  iris: 9.6, // aperture stop plane, s
  lensBack: 5.92, // back pole of the lens (stays put)
  N: 6.0, // nodal point, s
  disc: { at: 4.5, width: 1.8 }, // optic disc: arc distance nasal of the fovea, width, mm (retina)
  ora: 7.2, // ora serrata, s
  maxAcc: 11.9, // Gullstrand: accommodated eye minus relaxed eye, D
};

const sq = (v) => v * v;
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const DEG = Math.PI / 180;

const cornealCentre = () => EYE.apex - EYE.corneaR;
const lensPlane = () => EYE.apex - EYE.d;
// Accommodation A is counted the optometrist's way: the vergence (D) of the
// nearest target the eye now focuses, so a target at 25 cm needs A = 4.
// The lens power that does it comes from the two-surface model below; the
// whole eye's equivalent power rises a little more than A (60 to 64.8 D for
// A = 4), because the principal planes move with the lens.
const reduction = () => 1 - (EYE.d / 1000 / EYE.n) * EYE.Fc;
const retinaDistance = () => (lensPlane() + EYE.retinaIn) / 1000;
function lensPower(A) {
  const V1 = EYE.Fc - A;
  return EYE.n / retinaDistance() - V1 / (1 - (EYE.d / 1000 / EYE.n) * V1);
}
const eyePower = (A) => {
  const FL = lensPower(A);
  return EYE.Fc + FL - (EYE.d / 1000 / EYE.n) * EYE.Fc * FL;
};
const F0 = () => eyePower(0);

// Paraxial trace of one ray: height h (mm) at the cornea, target vergence L
// (D, negative for a near target), accommodation A (D).
function trace(h, L, A) {
  const { n, Fc, d } = EYE;
  const V1 = L + Fc;
  const l1 = (n / V1) * 1000; // mm behind the cornea, where the ray would cross the axis
  const atIris = h * (1 - (EYE.apex - EYE.iris) / l1);
  const atLens = h * (1 - d / l1);
  const V2 = V1 / (1 - (d / 1000 / n) * V1) + lensPower(A);
  const focus = lensPlane() - (n / V2) * 1000; // s of the image
  return { atIris, atLens, focus };
}

// Height at the cornea of the ray that grazes the pupil edge.
function entryHeight(pupil, L) {
  const V1 = L + EYE.Fc;
  const l1 = (EYE.n / V1) * 1000;
  return pupil / 2 / (1 - (EYE.apex - EYE.iris) / l1);
}

// s on the outer cornea at height h.
const corneaAt = (h) => cornealCentre() + Math.sqrt(Math.max(0, sq(EYE.corneaR) - sq(h)));

// Where a line from p along direction u first meets the retina (inner retina sphere).
function onRetina(p, u) {
  const r = EYE.retinaIn;
  const b = p[0] * u[0] + p[1] * u[1];
  const c = sq(p[0]) + sq(p[1]) - sq(r);
  const t = -b + Math.sqrt(Math.max(0, b * b - c));
  return [p[0] + u[0] * t, p[1] + u[1] * t];
}

// Arc distance along the retina from the fovea (back pole) to point q, signed nasal +.
const arcFromFovea = (q) => Math.atan2(q[1], -q[0]) * EYE.retinaIn;

// The bundle that gets through the pupil, as two edge rays and where each meets
// the retina. Returns everything the drawing and the readout need.
function bundle({ L, A, pupil }) {
  const h = entryHeight(pupil, L);
  const ray = trace(h, L, A);
  const sL = lensPlane();
  const edge = (sign) => {
    const a = [corneaAt(h), sign * h];
    const b = [EYE.iris, sign * ray.atIris];
    const c = [sL, sign * ray.atLens];
    const dir = [ray.focus - sL, -sign * ray.atLens];
    const len = Math.hypot(dir[0], dir[1]);
    const u = [dir[0] / len, dir[1] / len];
    const hit = onRetina(c, u);
    return { a, b, c, hit };
  };
  const retinaS = -EYE.retinaIn;
  const behind = retinaS - ray.focus; // > 0: focus lies behind the retina
  const blur = Math.abs(edge(1).hit[1] - edge(-1).hit[1]);
  return { h, focus: ray.focus, behind, blur, edges: [edge(1), edge(-1)] };
}

// Defocus in dioptres: what the eye still lacks to focus a target of vergence L.
const defocus = (L, A) => -L - A;

// Pupil diameter from scene luminance (Moon & Spencer 1944), mm.
const pupilFor = (luminance) => 4.9 - 3 * Math.tanh(0.4 * Math.log10(luminance));
// Retinal illuminance, trolands.
const trolands = (luminance, pupil) => luminance * Math.PI * sq(pupil / 2);

// Chief ray of a point at angle theta (deg, temporal +) in the field: it passes
// the nodal point and meets the nasal retina at the same angle.
function chief(theta) {
  const t = theta * DEG;
  const p = [EYE.N, 0];
  const u = [-Math.cos(t), Math.sin(t)];
  const hit = onRetina(p, u);
  const arc = arcFromFovea(hit);
  const half = EYE.disc.width / 2;
  const onDisc = Math.abs(arc - EYE.disc.at) <= half;
  return { hit, arc, onDisc, u };
}

// The blind spot's edges in the visual field (deg), solved from the disc on the retina.
function blindSpan() {
  const angleFor = (arc) => {
    let lo = 0;
    let hi = 40;
    for (let i = 0; i < 50; i++) {
      const mid = (lo + hi) / 2;
      if (chief(mid).arc < arc) lo = mid;
      else hi = mid;
    }
    return (lo + hi) / 2;
  };
  const half = EYE.disc.width / 2;
  return { from: angleFor(EYE.disc.at - half), mid: angleFor(EYE.disc.at), to: angleFor(EYE.disc.at + half) };
}

// The lens in section for accommodation A: Gullstrand's relaxed lens (front
// radius 10, back 6, thickness 3.6) blended toward his accommodated one
// (5.33, 5.33, 4.0) by the share of his 11.9 D range that A uses.
function lensShape(A, count = 28) {
  const a = clamp((eyePower(A) - eyePower(0)) / EYE.maxAcc, 0, 1);
  const Rf = 10 + (5.33 - 10) * a;
  const Rb = 6 + (5.33 - 6) * a;
  const T = 3.6 + 0.4 * a;
  const back = EYE.lensBack;
  const front = back + T;
  const sagF = (r) => Rf - Math.sqrt(Math.max(0, sq(Rf) - sq(r)));
  const sagB = (r) => Rb - Math.sqrt(Math.max(0, sq(Rb) - sq(r)));
  let lo = 0;
  let hi = Math.min(Rf, Rb);
  for (let i = 0; i < 50; i++) {
    const mid = (lo + hi) / 2;
    if (front - sagF(mid) > back + sagB(mid)) lo = mid;
    else hi = mid;
  }
  const re = (lo + hi) / 2;
  // Round the equator: the last 12% of the radius blends both faces into a curve.
  const frontPts = [];
  const backPts = [];
  for (let i = 0; i <= count; i++) {
    const r = re * Math.sin((i / count) * (Math.PI / 2));
    frontPts.push([front - sagF(r), r]);
    backPts.push([back + sagB(r), r]);
  }
  const eq = [(front - sagF(re) + back + sagB(re)) / 2, re];
  return { Rf, Rb, T, front, back, re, eq, frontPts, backPts, sagF, sagB };
}

// Lens outline as a closed polygon in (s, n), round the equator.
function lensOutline(A, count = 28) {
  const L = lensShape(A, count);
  const pull = 0.4; // equator rounding, mm
  const upper = [];
  const lower = [];
  const n = L.frontPts.length;
  for (let i = 0; i < n; i++) {
    const [sf, r] = L.frontPts[i];
    const sb = L.backPts[i][0];
    const t = r / L.re;
    const ease = Math.max(0, (t - 0.72) / 0.28);
    const shrink = pull * ease * ease;
    upper.push([sf + shrink * 0.25, r - shrink * 0.6]);
    lower.push([sb - shrink * 0.25, r - shrink * 0.6]);
  }
  const side = (sign) => [...upper.map(([s, r]) => [s, sign * r]), ...lower.slice().reverse().map(([s, r]) => [s, sign * r])];
  // From the front pole down the nasal side, round the equator, along the back
  // to the back pole, then up the temporal side back to the front pole.
  const nasal = side(1);
  const temporal = side(-1).reverse();
  let points = [...nasal, ...temporal.slice(1, -1)];
  for (let pass = 0; pass < 2; pass++) {
    const next = [];
    for (let i = 0; i < points.length; i++) {
      const a = points[i];
      const b = points[(i + 1) % points.length];
      next.push([a[0] * 0.75 + b[0] * 0.25, a[1] * 0.75 + b[1] * 0.25], [a[0] * 0.25 + b[0] * 0.75, a[1] * 0.25 + b[1] * 0.75]);
    }
    points = next;
  }
  return { points, shape: L };
}

// Ciliary body (one side, sign +1 nasal), for accommodation A: the muscle
// contracts, so the ring of processes moves in toward the lens and forward.
function ciliary(A, sign = 1) {
  const a = clamp((eyePower(A) - eyePower(0)) / EYE.maxAcc, 0, 1);
  const wall = (s) => Math.sqrt(sq(EYE.scleraIn) - sq(s));
  const angle = corneoscleralAngle();
  const root = [angle[0] - 0.08, angle[1] - 0.05];
  const tip = [8.95 + 0.25 * a, 5.78 - 0.55 * a];
  const pts = [];
  const steps = 10;
  for (let i = 0; i <= steps; i++) {
    const s = angle[0] + (EYE.ora - angle[0]) * (i / steps);
    pts.push([s, wall(s)]);
  }
  const plana = Math.sqrt(sq(EYE.choroidIn) - sq(EYE.ora));
  const inner = [
    [EYE.ora, plana],
    [8.0, Math.sqrt(sq(EYE.choroidIn - 0.15) - 64) - 0.05 - 0.15 * a],
    [8.55 + 0.15 * a, 6.55 - 0.45 * a],
    tip,
    [tip[0] + 0.35, tip[1] - 0.12],
    [9.6, 5.32],
    root,
  ];
  const flip = ([s, r]) => [s, sign * r];
  return { outline: [...pts, ...inner].map(flip), processes: [inner[2], inner[3], inner[4]].map(flip), tip: flip(tip), root: flip(root) };
}

// Where the inner cornea meets the inner sclera (the chamber angle).
function corneoscleralAngle() {
  const ci = EYE.apex - EYE.corneaThick - EYE.corneaInR;
  const R = EYE.scleraIn;
  const x = (sq(R) - sq(EYE.corneaInR) + sq(ci)) / (2 * ci);
  return [x, Math.sqrt(sq(R) - sq(x))];
}

// The iris (one side) for pupil diameter p: a wedge from the root to the
// pupil margin, resting on the front of the lens at the margin; it thickens
// as it gathers up when the pupil opens.
function iris(p, A, sign = 1) {
  const L = lensShape(A);
  const root = ciliary(A).root;
  const m = p / 2;
  const width = root[1] - m;
  const thick = clamp(0.35 + 1.4 / Math.max(width, 0.8), 0.55, 1.1);
  const backAt = (r) => Math.max(L.front - L.sagF(Math.min(r, L.re)) + 0.06, EYE.iris - 0.25);
  const back = [];
  const front = [];
  const steps = 8;
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const r = m + width * t;
    const bulge = Math.sin(Math.PI * Math.min(1, t * 1.4)) * thick * 0.7;
    const bs = backAt(r) + (root[0] - 0.45 - backAt(r)) * t * t;
    back.push([bs, r]);
    front.push([bs + 0.26 + bulge, r]);
  }
  const tipFront = [back[0][0] + 0.13, m - 0.04];
  const poly = [...back, root, ...front.slice().reverse(), tipFront];
  return { outline: poly.map(([s, r]) => [s, sign * r]), margin: [back[0][0], sign * m] };
}

// Accommodation dynamics: latency, then a critically damped response
// (10-90 % in about 0.6 s, peak about 8 D/s for a 4 D step); relaxing is slower.
const ACC = { latency: 0.36, omegaUp: 5.6, omegaDown: 4.2 };
// Pupil dynamics: constriction is quick, dilation takes several seconds.
const PUPIL = { latencyIn: 0.24, tauIn: 0.32, latencyOut: 0.3, tauOut: 1.6, nearMiosis: 0.1 };

const LIGHT = { bright: 1000, dim: 0.1 };
const NEAR = 0.25; // m

const P = {"origin":[337.2758743449707,233.0143169264656],"scale":0.5499545391243233,"azimuth":52,"elevation":50};
const S = 10, ZE = 166;
const X_FAR = -300, X_NEAR = -172;
const PANEL = {"y0":-26,"y1":80,"z0":136,"z1":196};
const KNOB_F = {"o":[-10,84,150],"a":[0,1,0],"u":[0,0,1],"v":[1,0,0]};
const W3 = ([s, n]) => [-s * S, -n * S, ZE];
const pe = (pts, closed = true) => pathOf(pts.map((p) => iso(W3(p), P)), closed);
const stage = document.querySelector(".iso-stage");
const svg = stage.querySelector("svg");
const q = (sel) => svg.querySelector(sel);
const readout = document.querySelector("[data-readout]");
const still = matchMedia("(prefers-reduced-motion: reduce)");
const el = {
  carriage: q('[data-part="carriage"]'), panel: q('[data-part="panel"]'), dot: q(".ey-dot"), knob: q("[data-knob]"),
  lens: q("[data-lens]"), lensEdge: q("[data-lens-edge]"), nucleus: q("[data-nucleus]"), zonules: q("[data-zonules]"),
  beam: q("[data-beam]"), rays: q("[data-rays]"), chief: q("[data-chief]"), spot: q("[data-spot]"),
  cil: [0, 1].map((i) => q('[data-c="' + i + '"]')), cilO: [0, 1].map((i) => q('[data-co="' + i + '"]')),
  iris: [0, 1].map((i) => q('[data-i="' + i + '"]')), irisO: [0, 1].map((i) => q('[data-io="' + i + '"]')),
};
const xAt = (D) => X_FAR + ((X_NEAR - X_FAR) * D) / 4;
// knob frame helpers (lathe's pointOf, inlined)
const pointOn = (F, s, r, a) => [0, 1, 2].map((i) => F.o[i] + F.a[i] * s + r * (Math.cos(a) * F.u[i] + Math.sin(a) * F.v[i]));
// Live behaviour for the eye model. Inlined after the kit, the model and the
// constants that build.mjs writes, so iso, pathOf, translateAlong, the model's
// functions (bundle, chief, lensOutline, iris, ciliary, pupilFor …) and P,
// S, ZE, el are in scope.

// ---- state: one set of targets that the tour, the pointer, the keys and the
// scenarios all write; one set of animated values the drawing reads ----------
const BLIND = blindSpan();
const P_BRIGHT = pupilFor(LIGHT.bright);
const target = { D: 0, lum: LIGHT.bright, theta: 7, dot: 0 };
const now = { D: 0, lum: LIGHT.bright, theta: 7, dot: 0, A: 0, Arate: 0, pupil: P_BRIGHT, t: 0 };
let topic = "rest";
const history = []; // [t, D seen, luminance] — what the eye was given, for the reflex latencies


const follow = (value, goal, dt, tau) => (Math.abs(goal - value) < 1e-4 ? goal : value + (goal - value) * (1 - Math.exp(-dt / tau)));
function seenAt(t) {
  for (let i = history.length - 1; i >= 0; i--) if (history[i][0] <= t) return history[i];
  return history[0] || [0, now.D, now.lum];
}

// ---- the reflexes ----------------------------------------------------------
function step(dt, calm) {
  now.t += dt;
  // what the person is given: the target box moves and its light changes quickly
  now.D = calm ? target.D : follow(now.D, target.D, dt, 0.11);
  const lumLog = calm ? Math.log10(target.lum) : follow(Math.log10(now.lum), Math.log10(target.lum), dt, 0.12);
  now.lum = 10 ** lumLog;
  if (Math.abs(lumLog - Math.log10(target.lum)) < 1e-4) now.lum = target.lum;
  now.theta = calm ? target.theta : follow(now.theta, target.theta, dt, 0.55);
  now.dot = calm ? target.dot : follow(now.dot, target.dot, dt, 0.25);
  history.push([now.t, now.D, now.lum]);
  while (history.length > 2 && history[1][0] < now.t - 1) history.shift();
  // accommodation: answers the target's vergence after a latency, critically damped
  const goalA = calm ? now.D : seenAt(now.t - ACC.latency)[1];
  if (calm) { now.A = goalA; now.Arate = 0; }
  else {
    const w = goalA > now.A ? ACC.omegaUp : ACC.omegaDown;
    for (let i = 0; i < 4; i++) {
      const h = dt / 4;
      now.Arate += (w * w * (goalA - now.A) - 2 * w * now.Arate) * h;
      now.A += now.Arate * h;
    }
    if (Math.abs(goalA - now.A) < 2e-4 && Math.abs(now.Arate) < 2e-3) { now.A = goalA; now.Arate = 0; }
  }
  // pupil: light reflex (quick to close, slow to open) plus a little near miosis
  const want = (lum) => pupilFor(lum) - PUPIL.nearMiosis * now.A;

  let tau = PUPIL.tauIn;
  if (goalP > now.pupil) { goalP = want(seenAt(now.t - PUPIL.latencyOut)[2]); tau = PUPIL.tauOut; }
  now.pupil = calm ? want(now.lum) : follow(now.pupil, goalP, dt, tau);
  if (Math.abs(now.pupil - goalP) < 0.002) now.pupil = goalP;
}
const settled = () =>
  now.D === target.D && now.lum === target.lum && now.theta === target.theta && now.dot === target.dot && now.Arate === 0 && now.A === now.D && Math.abs(now.pupil - (pupilFor(now.lum) - PUPIL.nearMiosis * now.A)) < 0.0021;

// ---- drawing -----------------------------------------------------------------
const f1 = (v) => v.toFixed(1);
const lumText = (l) => (l >= 10 ? Math.round(l).toString() : l >= 1 ? l.toFixed(1) : l.toFixed(2).replace(/0$/, ""));
const distText = (D) => (D < 0.01 ? "far" : D < 1 ? (1 / D).toFixed(1) + " m" : Math.round(100 / D) + " cm");
const brightness = (lum) => clamp((Math.log10(lum) + 1) / 4, 0, 1);

function draw() {
  const D = now.D;
  const xc = xAt(D);
  el.carriage.setAttribute("transform", translateAlong(P, [xc, 0, 0]));
  const b = brightness(now.lum);
  el.panel.style.opacity = (0.05 + 0.85 * b).toFixed(3);
  // dimmer pointer on the knob face: 270° of travel, 0.1 → 1000 cd/m²
  const ang = (-135 + 270 * b) * (Math.PI / 180);
  const c = pointOn(KNOB_F, 5.55, 0, 0), tip = pointOn(KNOB_F, 5.55, 4.2, ang);
  el.knob.setAttribute("d", pathOf([iso(c, P), iso(tip, P)]));

  // the eye's own parts
  const lens = lensOutline(now.A);
  el.lens.setAttribute("d", pe(lens.points));
  el.lensEdge.setAttribute("d", pe(lens.points));
  const mid = [(lens.shape.front + lens.shape.back) / 2, 0];
  el.nucleus.setAttribute("d", pe(lens.points.map(([s, n]) => [mid[0] + (s - mid[0]) * 0.56, n * 0.6])));
  const zon = [];
  [1, -1].forEach((sign, i) => {
    const cil = ciliary(now.A, sign);
    el.cil[i].setAttribute("d", pe(cil.outline));
    el.cilO[i].setAttribute("d", pe(cil.outline));
    const ir = iris(now.pupil, now.A, sign);
    el.iris[i].setAttribute("d", pe(ir.outline));
    el.irisO[i].setAttribute("d", pe(ir.outline));
    // zonule fibres: from the ciliary processes to the lens round its equator.
    // Taut when the ciliary muscle is relaxed, slack when it contracts.
    const slack = clamp((eyePower(now.A) - eyePower(0)) / 6, 0, 1);
    const n = lens.points.length;
    const eqIndex = lens.points.reduce((best, p, j) => (sign * p[1] > sign * lens.points[best][1] ? j : best), 0);
    for (let f = 0; f < 5; f++) {
      const pr = cil.processes;

      const seg = u < 0.5 ? [pr[0], pr[1], u * 2] : [pr[1], pr[2], (u - 0.5) * 2];
      const from = [seg[0][0] + (seg[1][0] - seg[0][0]) * seg[2], seg[0][1] + (seg[1][1] - seg[0][1]) * seg[2]];
      const to = lens.points[(eqIndex + (f - 2) * 2 + n) % n];
      const m = [(from[0] + to[0]) / 2, (from[1] + to[1]) / 2];
      const sag = [0.12 * slack * sign, 0.12 * slack * (f - 2) * 0.5];
      zon.push(pe([from, ...[0.25, 0.5, 0.75].map((t) => [from[0] + (to[0] - from[0]) * t + sag[1] * Math.sin(Math.PI * t), from[1] + (to[1] - from[1]) * t - sag[0] * Math.sin(Math.PI * t)]), to], false));
    }
  });
  el.zonules.setAttribute("d", zon.join(""));

  // the light from the target's cross, through the pupil to the retina
  const L = -D;
  const B = bundle({ L, A: now.A, pupil: now.pupil });
  const T = [-xc / S - 0.01, 0];
  const [e1, e2] = B.edges;
  let poly;
  const rays = [];
  if (B.focus > -E_RET) {
    const F = [B.focus, 0];
    poly = pe([T, e1.a, e1.b, e1.c, F, e2.c, e2.b, e2.a]) + pe([F, e1.hit, e2.hit]);
  } else poly = pe([T, e1.a, e1.b, e1.c, e1.hit, e2.hit, e2.c, e2.b, e2.a]);
  for (const e of B.edges) rays.push(pe([T, e.a, e.b, e.c, e.hit], false));
  el.beam.setAttribute("d", poly);
  el.beam.style.opacity = (0.02 + 0.08 * b).toFixed(3);
  el.rays.setAttribute("d", rays.join(""));
  el.rays.style.opacity = (0.2 + 0.5 * b).toFixed(3);

  // the test dot and its chief ray through the nodal point
  const ch = chief(now.theta);
  const Ddraw = -EYE.N * S - xc;
  const yDot = Ddraw * Math.tan(now.theta * DEG);
  const dotScreen = iso([0.05, yDot, ZE], P);
  const base = iso([0, 0, 0], P);
  el.dot.setAttribute("cx", (dotScreen[0] - base[0]).toFixed(2));
  el.dot.setAttribute("cy", (dotScreen[1] - base[1]).toFixed(2));
  el.dot.style.opacity = now.dot.toFixed(3);
  const dotWorld = [xc + 0.05, yDot, ZE];
  el.chief.setAttribute("d", pathOf([iso(dotWorld, P), iso(W3(ch.hit), P)]));
  el.chief.style.opacity = (now.dot * (0.35 + 0.6 * b)).toFixed(3);
  const spot = iso(W3(ch.hit), P);
  el.spot.setAttribute("cx", spot[0].toFixed(2));
  el.spot.setAttribute("cy", spot[1].toFixed(2));
  el.spot.style.opacity = (now.dot * (ch.onDisc ? 0.25 : 1)).toFixed(3);

  say(readoutText(B, ch));
}
const E_RET = EYE.retinaIn;

function readoutText(B, ch) {
  const pupil = "pupil " + f1(now.pupil) + " mm";
  if (topic === "dot" || (topic === "rest" && now.dot > 0.5)) {
    return "dot " + f1(now.theta) + "° temporal · " + (ch.onDisc ? "on the optic disc · unseen" : f1(Math.abs(ch.arc)) + " mm from fovea · seen");
  }
  if (topic === "light") {
    const area = (now.pupil / P_BRIGHT) ** 2;
    return lumText(now.lum) + " cd/m² · " + pupil + (area > 1.05 ? " · " + f1(area) + "× the pupil area" : "");
  }
  if (topic === "focus") {
    const off = B.behind;
    const focus = Math.abs(off) < 0.03 ? "in focus" : "focus " + Math.abs(off).toFixed(2) + " mm " + (off > 0 ? "behind" : "short of") + " retina";
    return distText(now.D) + " · accommodation +" + f1(now.A) + " D · " + focus;
  }
  return distText(now.D) + " · accommodation +" + f1(now.A) + " D · " + pupil;
}
let said = "";
function say(text) {
  if (text !== said) { readout.textContent = text; said = text; }
}
function describe() {
  const words = {
    rest: "Resting: looking far in bright light, lens relaxed, pupil " + f1(target.lum === LIGHT.bright ? P_BRIGHT : pupilFor(target.lum)) + " millimetres",
    focus: "Target at " + (target.D < 0.01 ? "a far distance" : Math.round(100 / target.D) + " centimetres") + ", the eye accommodates " + f1(target.D) + " dioptres",
    light: "Light " + lumText(target.lum) + " candela per square metre, pupil opens to " + f1(pupilFor(target.lum)) + " millimetres",
    dot: "Test dot at " + f1(target.theta) + " degrees temporal" + (chief(target.theta).onDisc ? ", on the blind spot" : ""),
  };
  stage.setAttribute("aria-valuenow", String(target.D));
  stage.setAttribute("aria-valuetext", words[topic] || words.rest);
}

// ---- loop ----------------------------------------------------------------------
let frame = 0, last = 0, visible = false;
function tick(t) {
  const dt = last ? Math.min((t - last) / 1000, 1 / 30) : 1 / 60;
  last = t;
  const calm = still.matches;
  if (touring && !driven) tourStep(dt);
  if (driven && pending && now.t >= pending.at) { const p = pending; pending = null; p.run(); describe(); }
  step(dt, calm);
  draw();
  const idle = settled() && !(touring && !driven) && !pending;
  frame = visible && !idle ? requestAnimationFrame(tick) : 0;
}
const run = () => { if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); } };
new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);

// ---- idle tour ---------------------------------------------------------------
const TOUR = [
  [2.4, () => set({ D: 0, lum: LIGHT.bright, dot: 0 }, "rest")],
  [4.2, () => set({ D: 1 / NEAR }, "focus")],
  [3.4, () => set({ D: 0 }, "focus")],
  [7.5, () => set({ lum: LIGHT.dim }, "light")],
  [3.4, () => set({ lum: LIGHT.bright }, "light")],
  [1.6, () => set({ dot: 1, theta: 7 }, "dot")],
  [4.6, () => set({ theta: BLIND.mid }, "dot")],
  [2.4, () => set({ theta: 7 }, "dot")],
];
let touring = !still.matches, tourClock = 0, tourIndex = -1, tourNext = 1.4, idleTimer = 0;
function tourStep(dt) {
  tourClock += dt;
  if (tourClock >= tourNext) {
    tourIndex = (tourIndex + 1) % TOUR.length;
    TOUR[tourIndex][1]();
    tourNext = tourClock + TOUR[tourIndex][0];
  }
}
function set(values, name) {
  Object.assign(target, values);
  if (name && name !== topic) { topic = name; }
  describe();
}

// ---- pointer and keyboard (ignored while a scenario drives the figure) ------
function interact() {
  if (driven) return false;
  touring = false;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (!driven && !still.matches) { touring = true; tourClock = 0; tourIndex = -1; tourNext = 0.2; run(); } }, 3600);
  return true;
}
stage.addEventListener("pointermove", (event) => {
  if (!interact()) return;
  // the pointer's x over the rail's own screen span: left is far, right is 25 cm
  const box = svg.getBoundingClientRect();
  const vx = ((event.clientX - box.left) / box.width) * svg.viewBox.baseVal.width;
  const x0 = iso([xAt(0), 0, ZE], P)[0], x1 = iso([xAt(4), 0, ZE], P)[0];
  const share = clamp((vx - x0) / (x1 - x0), 0, 1);
  set({ D: Math.round(share * 4 * 20) / 20 }, "focus");
  run();
});
stage.addEventListener("keydown", (event) => {
  const key = event.key;
  let handled = true;
  if (!["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Home", "End", "b", "B", "Escape"].includes(key)) return;
  if (!interact()) { event.preventDefault(); return; }
  if (key === "ArrowLeft") set({ D: clamp(target.D - 0.5, 0, 4) }, "focus");
  else if (key === "ArrowRight") set({ D: clamp(target.D + 0.5, 0, 4) }, "focus");
  else if (key === "Home") set({ D: 0 }, "focus");
  else if (key === "End") set({ D: 4 }, "focus");
  else if (key === "ArrowUp") set({ lum: clamp(target.lum * 10, LIGHT.dim, LIGHT.bright) }, "light");
  else if (key === "ArrowDown") set({ lum: clamp(target.lum / 10, LIGHT.dim, LIGHT.bright) }, "light");
  else if (key === "b" || key === "B") set(target.dot > 0.5 && target.theta === BLIND.mid ? { theta: 7 } : { dot: 1, theta: BLIND.mid }, "dot");
  else if (key === "Escape") set({ D: 0, lum: LIGHT.bright, dot: 0, theta: 7 }, "rest");
  else handled = false;
  if (handled) event.preventDefault();
  run();
});

// ---- scenarios: the hook a parent page drives -----------------------------
// anatomyScenario(id) or postMessage({ type: "scenario", id }). Each scenario
// starts from its own starting state, plays out with the real timings, and then
// holds until another arrives; while driven, the tour and input are off.
let driven = false, pending = null;
function startFrom(values) {
  Object.assign(target, values);
  Object.assign(now, { D: target.D, lum: target.lum, theta: target.theta, dot: target.dot, A: target.D, Arate: 0 });
  now.pupil = pupilFor(now.lum) - PUPIL.nearMiosis * now.A;
  history.length = 0;
  history.push([now.t, now.D, now.lum]);
}
const SCENARIOS = {
  rest() { set({ D: 0, lum: LIGHT.bright, dot: 0, theta: 7 }, "rest"); },
  near() {
    startFrom({ D: 0, lum: LIGHT.bright, dot: 0, theta: 7 });
    set({}, "focus");
    pending = { at: now.t + 0.6, run: () => set({ D: 1 / NEAR }, "focus") };
  },
  dim() {
    startFrom({ D: 0, lum: LIGHT.bright, dot: 0, theta: 7 });
    set({}, "light");
    pending = { at: now.t + 0.6, run: () => set({ lum: LIGHT.dim }, "light") };
  },
  blindspot() {
    startFrom({ D: 0, lum: LIGHT.bright, dot: 1, theta: 7 });
    set({}, "dot");
    pending = { at: now.t + 0.6, run: () => set({ theta: BLIND.mid }, "dot") };
  },
};
function scenario(id) {
  if (id === null || id === "tour" || id === "free") {
    driven = false; pending = null; touring = !still.matches; tourClock = 0; tourIndex = -1; tourNext = 0.2; run();
    return true;
  }
  const play = SCENARIOS[id];
  if (!play) return false;
  driven = true;
  touring = false;
  clearTimeout(idleTimer);
  pending = null;
  play();
  if (still.matches && pending) { const p = pending; pending = null; p.run(); }
  stage.dataset.scenario = id;
  last = 0;
  if (!frame) { if (visible) run(); else { step(0, still.matches); draw(); } }
  return true;
}
window.anatomyScenario = scenario;
window.addEventListener("message", (event) => {
  const data = event && event.data;
  if (data && typeof data === "object" && data.type === "scenario" && typeof data.id === "string") scenario(data.id);
});

draw();
describe();
</script></body></html>
